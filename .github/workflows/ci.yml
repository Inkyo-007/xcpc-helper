# CI：push 到 main 与每个 PR 自动运行验证命令（与 AGENTS.md「验证命令」一致），
# 任一环节失败则标红，用于保证主干与社区贡献的质量。
# 后端在 Windows / Linux / macOS 三平台矩阵验证，防止平台相关的回归。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run pytest
      - run: uv run ruff check src tests

  frontend:
    # 前端为纯 Web 栈，无平台差异，单平台验证即可
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
